    <link rel="preload" as="image" href="./images/hero-clean-hd.jpg" fetchpriority="high" />
    <title>AXOMONE – Explore Assam, Culture, Places &amp; Local Services</title>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://axomoneofficial-code.github.io/axomonee/" />
    <meta property="og:title" content="AXOMONE — Discover Local. Connect Assam." />
    <meta property="og:description" content="Discover Assam with AXOMONE. Explore districts, heritage sites, temples, universities, local businesses, Assamese culture, tourism and useful local resources." />
    <meta property="og:image" content="https://axomoneofficial-code.github.io/axomonee/images/axom-nav-emblem.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://axomoneofficial-code.github.io/axomonee/" />
    <meta name="twitter:title" content="AXOMONE — Discover Local. Connect Assam." />
    <meta name="twitter:description" content="Discover Assam with AXOMONE. Explore districts, heritage sites, temples, universities, local businesses, Assamese culture, tourism and useful local resources." />
    <meta name="twitter:image" content="https://axomoneofficial-code.github.io/axomonee/images/axom-nav-emblem.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://axomoneofficial-code.github.io/axomonee/#website",
          "name": "AXOMONE",
          "alternateName": ["Axom One", "অসম এক মঞ্চ", "AxomOne"],
          "url": "https://axomoneofficial-code.github.io/axomonee/",
          "description": "Discover Assam with AXOMONE. Explore 35 official administrative districts, heritage sanctuaries, universities, temples, and verified civic directories.",
          "inLanguage": ["as", "en", "hi"],
          "publisher": {
            "@id": "https://axomoneofficial-code.github.io/axomonee/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://axomoneofficial-code.github.io/axomonee/explore?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://axomoneofficial-code.github.io/axomonee/#organization",
          "name": "AXOMONE",
          "url": "https://axomoneofficial-code.github.io/axomonee/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://axomoneofficial-code.github.io/axomonee/images/axom-nav-emblem.png",
            "caption": "AXOMONE Emblem"
          },
          "slogan": "Discover Local. Connect Assam.",
          "knowsAbout": ["Assam Tourism", "Assam Districts", "Assamese Culture", "Assam Universities", "Assam Temples"]
        }
      ]
    }
    </script>

    <!-- GitHub Pages Single Page Application URL Decoder -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- DNS Prefetch & Preconnect for High-Speed Connection -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Critical Hero Banner & Header Gamusa Image for Instant First Paint -->
    <link rel="preload" as="image" href="./images/hero-panoramic-master.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./images/gamusa-top-strip.png" type="image/png" />

    <!-- Non-Render-Blocking Asynchronous Google Fonts Loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      />
    </noscript>
  </head>
  <body>

  </body>
